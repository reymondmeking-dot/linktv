name: Apple builds

on:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'apple/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS, iPhone and iOS Simulator
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iPhone and its broadcast extension
        run: |
          xcodebuild -project LinkTV.xcodeproj -scheme LinkTV-iPhone \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/linktv-ios" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
          test -d "$RUNNER_TEMP/linktv-ios/Build/Products/Release-iphoneos/LinkTV-iPhone.app/PlugIns/LinkTVBroadcast.appex"
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project LinkTV.xcodeproj -scheme LinkTV-iPhone \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/linktv-simulator" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
          test -d "$RUNNER_TEMP/linktv-simulator/Build/Products/Release-iphonesimulator/LinkTV-iPhone.app/PlugIns/LinkTVBroadcast.appex"
      - name: Verify the application audio conversion
        run: |
          xcrun swiftc Sources/AppleCapturedPCM.swift Tests/PCMConversionSmoke.swift -o "$RUNNER_TEMP/pcm-conversion"
          "$RUNNER_TEMP/pcm-conversion"
      - name: Build for Apple silicon and Intel Macs
        run: |
          xcodebuild -project LinkTV.xcodeproj -scheme LinkTV-Mac \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/linktv-mac" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO 'ARCHS=arm64 x86_64' build
          app="$RUNNER_TEMP/linktv-mac/Build/Products/Release/LinkTV-Mac.app"
          lipo "$app/Contents/MacOS/LinkTV-Mac" -verify_arch arm64 x86_64
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/LinkTV-Mac-preview.zip"
      - name: Upload Mac preview build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: LinkTV-Mac-preview
          path: ${{ runner.temp }}/LinkTV-Mac-preview.zip
          if-no-files-found: error
